<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMozGlow has moved to Tinker Tailor</title>
<link rel="canonical" href="https://www.tinkertailor.ca/pages/cmozglow">
<meta name="robots" content="noindex, follow">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    // Old embeds (?embed=1) keep working from this site.
    if (q.get("embed")) {
      location.replace("CMozGlow/cmozglow-site-embed.html" + location.search + location.hash);
      return;
    }
    // Everyone else goes to the new page, keeping ?theme= and #section links.
    var t = q.get("theme");
    location.replace("https://www.tinkertailor.ca/pages/cmozglow" + (t ? "?theme=" + encodeURIComponent(t) : "") + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://www.tinkertailor.ca/pages/cmozglow">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E0B14; color: #EFEAF6;
         font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  a { color: #FF2A78; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <h1>CMozGlow has moved</h1>
    <p>The live simulator and code generator now live on Tinker Tailor:<br>
    <a href="https://www.tinkertailor.ca/pages/cmozglow">tinkertailor.ca/pages/cmozglow</a></p>
    <p>The library is still on <a href="https://github.com/cmoz/CMozGlow">GitHub</a>.</p>
  </main>
</body>
</html>
